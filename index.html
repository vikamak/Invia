function reg(){const u=S.u;return shell(`<div style="text-align:center;margin:8px 0 6px"><img src="${ICON}" alt="Иконка Invia" style="height:118px;display:block;margin:0 auto 6px"><div class="script" style="font-size:44px;line-height:1">Invia</div></div><p class="sub">Знакомства без переписки.<br>Меньше сообщений — больше живых встреч.</p>
<div class="card" style="text-align:center"><label for="pf" style="cursor:pointer;display:grid;justify-items:center;gap:8px;margin-bottom:18px">${u.ph?av('me',112):`<div class="av" style="width:112px;height:112px;border:1.5px dashed var(--mute);color:var(--mute);background:#120908">${ic('camera',36)}</div>`}<span class="mute" style="font-size:13px">Добавить фото</span></label>
<input id="pf" type="file" accept="image/*" hidden onchange="photo(this)">
<input class="in" id="rn" placeholder="Имя" value="${esc(u.n)}">
<div class="lb">Дата рождения</div><div class="wheels">${wheel('d',rng(1,31),rng(1,31),u.bd.d)}${wheel('m',MO,rng(1,12),u.bd.m)}${wheel('y',rng(1950,2008),rng(1950,2008),u.bd.y)}</div>
<div class="lb">Пол</div>${seg('sex',[['m','Мужской'],['f','Женский']])}
<div class="lb">Кого ищу</div>${seg('look',[['f','Женщин'],['m','Мужчин']])}
<button class="btn main" onclick="startChat()">Продолжить</button></div>`)}
function photo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{S.u.n=$('#rn').value;S.u.ph=e.target.result;render()};r.readAsDataURL(f)}
function startChat(){const n=$('#rn').value.trim(),a=age();S.u.n=n;if(!n)return toast('Введи имя, чтобы продолжить');if(a<18)return toast('Приложение доступно с 18 лет');if(!S.u.sex)return toast('Выбери свой пол');if(!S.u.look)return toast('Выбери, кого ищешь');S.u.a=a;S.chat=[];S.step='intro';S.scr='chat';render();askStep()}
function skipChat(){Object.assign(S.u,{job:'',int:'',food:'',weekend:'',values:'',world:'',zodiac:'',height:'',edu:'',alco:'',smoke:'',bio:''});go({scr:'confirm',skipped:1})}
/* ---- AI-interview engine: parses free text, then asks smart, skippable follow-ups ---- */
const JOBS=['строитель','дизайнер','программист','разработчик','менеджер','маркетолог','врач','инженер','психолог','фотограф','архитектор','стилист','модель','юрист','учитель','преподаватель','предприниматель','музыкант','актёр','актер','повар','пилот','военный','тренер','бариста','флорист','визажист','бухгалтер','аналитик','копирайтер'];
const HOB=[['пе(ть|ни)','пение'],['чита','чтение'],['бег','бег'],['гольф','гольф'],['рисова','рисование'],['путешеств','путешествия'],['готов','готовку'],['танц','танцы'],['фотограф','фотографию'],['\\bкино','кино'],['музык','музыку'],['йог','йогу'],['серф','сёрфинг'],['плава','плавание'],['шахмат','шахматы'],['\\bспорт','спорт'],['вело','велоспорт'],['театр','театр'],['рыбал','рыбалку'],['книг','книги']];
const MSG={weekend:'Как выглядит твой идеальный выходной?',values:'Что ты ценишь в людях?',world:'А какое у тебя мировоззрение или взгляд на жизнь?',zodiac:'Забавный вопрос: ты веришь в знаки зодиака?',zpick:'Здорово! Какой у тебя знак — учту звёзды при подборе пар.',height:'Какой у тебя рост, в сантиметрах?',edu:'Какое у тебя образование?',alco:'Как ты относишься к алкоголю?',smoke:'А как насчёт курения?',done:'Отлично, ты супер человек! Вот твоя анкета:'};
const EDU=['Среднее','Среднее специальное','Высшее','Учусь в вузе'],ALCO=['Не пью','Иногда','По особым случаям','Часто'],SMOKE=['Не курю','Иногда','Курю'],ZODIAC=['Овен','Телец','Близнецы','Рак','Лев','Дева','Весы','Скорпион','Стрелец','Козерог','Водолей','Рыбы'];
const NEXT={weekend:'values',values:'world',world:'zodiac',zpick:'height',height:'edu',edu:'alco',alco:'smoke',smoke:'done'};
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function parseIntro(v){const t=v.toLowerCase();let job='';for(const j of JOBS)if(t.includes(j)){job=cap(j);break}const found=[];for(const[re,label]of HOB){if(new RegExp(re,'i').test(t)&&!found.includes(label))found.push(label)}S.u.job=job;S.u.int=found.length?cap(found.join(', ')):''}
function summaryText(){const j=S.u.job||'пока не указана',i=S.u.int||'пока не указаны';return `Кажется, я тебя понял! Вот что получилось:\nПрофессия: ${j}\nУвлечения: ${i}`}
function chat(){const s=S.step;return `<div style="display:flex;flex-direction:column;height:100%"><h1>AI-анкета</h1><p class="sub">${s=='intro'?'Расскажи о себе своими словами — я сам разложу это по пунктам.':'Отвечай коротко. Неудобный вопрос можно пропустить.'}</p><div style="text-align:center;margin:-8px 0 12px"><button class="chip" onclick="skipChat()">Пропустить и заполнить самому</button></div><div id="msgs" style="flex:1;overflow-y:auto">${S.chat.map(m=>`<div class="msg ${m.w}">${esc(m.t)}</div>`).join('')}</div>${ctrl()}</div>`}
function ctrl(){const s=S.step;
if(s=='zodiac')return `<div style="display:flex;gap:10px;padding-top:8px"><button class="btn sm main" style="flex:1" onclick="answerYesNo('да')">Да</button><button class="btn sm" style="flex:1" onclick="answerYesNo('нет')">Нет</button></div>${skipRow()}`;
if(s=='zpick')return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:8px">${ZODIAC.map(z=>`<button class="chip" style="text-align:center" onclick="answerZodiac('${z}')">${z}</button>`).join('')}</div>${skipRow()}`;
if(s=='edu')return btnGrid(EDU,'edu');if(s=='alco')return btnGrid(ALCO,'alco');if(s=='smoke')return btnGrid(SMOKE,'smoke');
if(s=='done')return '';
return `<div style="display:flex;gap:8px;padding-top:8px"><input class="in" id="ci" style="margin:0" ${s=='height'?'type="number"':''} placeholder="${s=='intro'?'Например: Антон 23 года, я строитель, люблю петь, читать, бегать...':'Твой ответ…'}" onkeydown="if(event.key==='Enter')sendText()"><button class="btn sm main" onclick="sendText()">➤</button></div>${s=='intro'?'':skipRow()}`}
function btnGrid(opts,key){return `<div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:8px">${opts.map(o=>`<button class="chip" onclick="answerButtons('${key}','${o}')">${o}</button>`).join('')}</div>${skipRow()}`}
function skipRow(){return `<div style="text-align:center;margin-top:8px"><button class="chip" onclick="skipStep()">Пропустить вопрос</button></div>`}
function askStep(){S.chat.push({w:'ai',t:MSG[S.step]||'Расскажи о себе, а я помогу тебе составить профиль.'});draw();if(S.step=='done')setTimeout(finishChat,900)}
function draw(){$('#app').innerHTML=shell(chat());const m=$('#msgs');m.scrollTop=m.scrollHeight;const ci=$('#ci');if(ci)ci.focus()}
function sendText(){const v=$('#ci').value.trim();if(!v)return toast('Напиши ответ или нажми «Пропустить вопрос»');S.chat.push({w:'me',t:v});draw();
if(S.step=='intro'){setTimeout(()=>{parseIntro(v);S.chat.push({w:'ai',t:summaryText()});draw();S.step='weekend';setTimeout(askStep,750)},550);return}
S.u[S.step]=v;const nx=NEXT[S.step];S.step=nx;setTimeout(askStep,550)}
function answerYesNo(v){S.chat.push({w:'me',t:v==='да'?'Да':'Нет'});draw();
if(v==='да'){S.step='zpick';setTimeout(askStep,550)}
else{setTimeout(()=>{S.u.zodiac='';S.chat.push({w:'ai',t:'Я тоже больше верю в химию между людьми, чем в ретроградный Меркурий.'});draw();S.step='height';setTimeout(askStep,750)},550)}}
function answerZodiac(z){S.u.zodiac=z;S.chat.push({w:'me',t:z});draw();S.step='height';setTimeout(askStep,550)}
function answerButtons(key,val){S.u[key]=val;S.chat.push({w:'me',t:val});draw();S.step=NEXT[key];setTimeout(askStep,550)}
function skipStep(){S.chat.push({w:'me',t:'Пропускаю этот вопрос'});draw();const map={weekend:'values',values:'world',world:'zodiac',zodiac:'height',zpick:'height',height:'edu',edu:'alco',alco:'smoke',smoke:'done'};S.step=map[S.step];setTimeout(askStep,550)}
function finishChat(){const u=S.u,parts=[];if(u.job)parts.push(u.job);if(u.int)parts.push('увлекается: '+u.int.toLowerCase());if(u.weekend)parts.push('идеальный выходной — '+u.weekend.toLowerCase());if(u.values)parts.push('ценит в людях '+u.values.toLowerCase());if(u.world)parts.push(u.world.toLowerCase());u.bio=parts.length?cap(parts.join('. '))+'.':'';go({scr:'confirm',skipped:0})}
function confirmP(){const u=S.u;return shell(`<h1>Твоя анкета</h1><p class="sub">${S.skipped?'Заполни анкету сам — позже её можно изменить в профиле.':'AI собрал её из твоих ответов. Всё верно?'}</p><div class="card"><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${av('me',70)}<div style="font-size:20px">${esc(u.n)}, ${u.a}</div></div>
<label class="mute" style="font-size:13px">Профессия</label><input class="in" id="e1" placeholder="Например: дизайнер" value="${esc(u.job)}"><label class="mute" style="font-size:13px">Интересы</label><input class="in" id="e2" placeholder="Хобби, интересы" value="${esc(u.int)}"><label class="mute" style="font-size:13px">Еда</label><input class="in" id="e3" placeholder="Любимая кухня" value="${esc(u.food)}"><label class="mute" style="font-size:13px">О себе</label><textarea class="in" id="e4" rows="3" placeholder="Пара слов о себе">${esc(u.bio)}</textarea>
<label class="mute" style="font-size:13px">Мировоззрение</label><textarea class="in" id="e10" rows="2" placeholder="Взгляд на жизнь">${esc(u.world)}</textarea>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="mute" style="font-size:13px">Знак зодиака</label><input class="in" id="e5" placeholder="Не указан" value="${esc(u.zodiac)}"></div><div><label class="mute" style="font-size:13px">Рост, см</label><input class="in" id="e6" type="number" placeholder="178" value="${esc(u.height)}"></div></div>
<label class="mute" style="font-size:13px">Образование</label><input class="in" id="e7" placeholder="Например: Высшее" value="${esc(u.edu)}">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="mute" style="font-size:13px">Алкоголь</label><input class="in" id="e8" placeholder="Иногда" value="${esc(u.alco)}"></div><div><label class="mute" style="font-size:13px">Курение</label><input class="in" id="e9" placeholder="Не курю" value="${esc(u.smoke)}"></div></div></div>
<button class="btn main" onclick="saveP()">Подтвердить анкету</button><p class="sub" style="margin-top:12px">Правки можно внести здесь — потом AI подберёт совпадения.</p>`)}
function saveP(){Object.assign(S.u,{job:$('#e1').value,int:$('#e2').value,food:$('#e3').value,bio:$('#e4').value,world:$('#e10').value,zodiac:$('#e5').value,height:$('#e6').value,edu:$('#e7').value,alco:$('#e8').value,smoke:$('#e9').value});go({scr:'match'});setTimeout(()=>go({scr:'app',tab:'home'}),1800)}
function match(){return `<main style="display:grid;place-items:center;text-align:center"><div><div class="script" style="font-size:48px">Ищем совпадения…</div><p class="sub">AI сравнивает интересы и любимые места</p><div>${ic('heart',56)}</div></div></main>`}
/* ---------- home feed ---------- */
function home(){const left=S.prem?'∞':3-S.sent;return (S.prem?'':`<div class="ad" onclick="paywall()"><span>Реклама · Grand Café: −10% для пар Invia</span><span>Убрать</span></div>`)+P.filter(p=>!S.u.look||p.s==S.u.look).map((p,i)=>{const k=S.ph[p.id]||0;return `<section class="feed" ${!S.prem&&i==0?'style="padding-top:58px"':''}>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 6px"><div style="display:flex;align-items:center;gap:8px"><img src="${ICON}" alt="" style="height:30px"><span class="script" style="font-size:26px">Invia</span></div><span class="mute" style="font-size:12px">${S.prem?'Без лимита приглашений':`Приглашений: ${left} из 3`}</span></div>
<div class="photo ph" style="background:${grad(p.g,k)}" onclick="nextPh(${p.id})"><span style="opacity:.14">${ic('user',150)}</span><div style="position:absolute;left:14px;top:14px">${av(p.id,50)}</div><div class="dots">${[0,1,2,3].map(j=>`<u class="${j==k?'on':''}"></u>`).join('')}</div>
<div class="info"><div class="nm">${p.n}, ${p.a}</div><div style="font-size:13px;margin:5px 0 8px;color:var(--gold);letter-spacing:.04em">${p.j}</div><div style="font-size:12.5px;line-height:1.55;opacity:.82">Вас объединяет: ${p.c}</div></div></div>
<button class="btn main go" onclick="invite(${p.id})"><span>Пригласить на свидание</span></button><div class="mute" style="text-align:center;font-size:11px;letter-spacing:.08em">ЛИСТАЙ ВВЕРХ ↑</div></section>`}).join('')}
function nextPh(id){S.ph[id]=((S.ph[id]||0)+1)%4;const m=$('#mn').scrollTop;render();$('#mn').scrollTop=m}
function invite(id){if(!S.prem&&S.sent>=3)return paywall('Лимит: 3 приглашения в неделю. С подпиской — без ограничений.');S.inv={p:id,pl:null,d:null,t:null,cond:null,tx:'',st:'lace'};go({scr:'inv',tab:'home',open:null})}
/* ---------- invitation ---------- */
function inv(){const v=S.inv;return shell(`<h1>Приглашение</h1><div class="card" style="border-radius:44px;padding:20px"><div style="display:flex;justify-content:center;margin-bottom:8px">${av(v.p,76)}</div>
<div class="rowf" onclick="pickPlace()"><b>Место свидания:</b><span class="${v.pl?'ok':''}">${v.pl?plc(v.pl).n:'выбрать →'}</span></div>
<div class="rowf" onclick="tg('date')"><b>Дата и время:</b><span class="${v.d?'ok':''}">${v.d?v.d+' сентября, '+v.t:'выбрать'}</span></div>
${S.open=='date'?`${calHTML(v.d,'pd')}<div class="times">${T.map(t=>`<button class="${v.t==t?'sel':''}" onclick="S.inv.t='${t}';render()">${t}</button>`).join('')}</div>`:''}
<div class="rowf" onclick="tg('cond')"><b>Условия:</b><span class="${v.cond?'ok':''}">${v.cond||'выбрать'}</span></div>
${S.open=='cond'?['Забронировать и закрыть счёт','Предложить забронировать и закрыть счёт'].map((c,i)=>`<div class="opt ${v.cond==c?'sel':''}" onclick="S.inv.cond='${c}';render()">${v.cond==c?'☑':'☐'} ${c}</div>`).join('')+`<div class="sticky">Можно взять инициативу на себя или предложить другому человеку забронировать место и закрыть счёт.</div>`:''}
<div style="padding:14px 0 0;font-size:15px">Письмо-приглашение:</div>
<div class="chips" style="margin:8px 0 0">${ST.map(([k,l])=>`<button class="chip ${v.st==k?'on':''}" onclick="S.inv.tx=$('#lt').value;S.inv.st='${k}';render()">${l}</button>`).join('')}</div>
<div class="letter s-${v.st}"><textarea id="lt" maxlength="99" placeholder="Введите текст…" oninput="S.inv.tx=this.value;$('#cn').textContent=this.value.length+'/99'">${esc(v.tx)}</textarea><small id="cn">${v.tx.length}/99</small></div>
<div class="sticky" style="margin-top:20px">Только 99 символов — чтобы каждое сообщение имело ценность и не превращалось в бессмысленный чат. Меньше переписки → больше реальных встреч.</div>
<div style="text-align:center;margin-top:14px"><button class="btn main" onclick="sendInv()">Отправить приглашение ➤</button><button class="btn sm" style="margin-top:10px;border:0;background:none;color:var(--mute)" onclick="tab('home')">Отмена</button></div></div>`,'')}
function tg(k){S.inv.tx=$('#lt')?$('#lt').value:S.inv.tx;S.open=S.open==k?null:k;render()}
function pickPlace(){S.inv.tx=$('#lt').value;go({scr:'app',tab:'place',pick:true,pd:null})}
function sendInv(){const v=S.inv;v.tx=$('#lt').value;if(!v.pl)return toast('Выбери место свидания');if(!v.d||!v.t)return toast('Выбери дату и время');if(!v.cond)return toast('Выбери условия');if(!v.tx.trim())return toast('Напиши короткое письмо');
S.sent++;S.ev.push({d:v.d,t:v.t.replace('.','.'),pl:plc(v.pl).n,p:v.p,st:'wait'});S.inv=null;go({scr:'app',tab:'plan'});toast('Письмо отправлено. Ждём ответ')}
function calHTML(sel,fn){const ds=S.ev.filter(e=>e.st!='no').map(e=>e.d);return `<div class="cal" style="margin-top:12px">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map(d=>`<b>${d}</b>`).join('')}${'<span></span>'.repeat(2)}${Array.from({length:30},(_,i)=>i+1).map(d=>`<button class="${d==sel?'sel':''} ${d==16?'today':''}" ${fn=='pd'&&d<16?'disabled':''} onclick="${fn=='pd'?`S.inv.d=${d};S.inv.t=S.inv.t||'19.00'`:`S.sd=${d}`};render()">${d}${ds.includes(d)?'<i></i>':''}</button>`).join('')}</div>`}
function calGrid(sel,onclick){const ds=S.ev.map(e=>e.d);return `<div class="cal" id="plCal">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'].map(d=>`<b>${d}</b>`).join('')}${'<span></span>'.repeat(2)}${Array.from({length:30},(_,i)=>i+1).map(d=>`<button data-d="${d}" class="${d==sel?'sel':''} ${d==16?'today':''}" onclick="${onclick}(${d})">${d}${ds.includes(d)?'<i></i>':''}</button>`).join('')}</div>`}
function pickDay(d){S.sd=d;const box=document.getElementById('plCal');if(box)box.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',+b.dataset.d===d));const el=document.getElementById('dayInfo');if(el)el.innerHTML=dayInfoHTML(d)}
function dayInfoHTML(d){const es=S.ev.filter(e=>e.d==d);if(!es.length)return `<div class="card mute" style="border-radius:28px;text-align:center">На ${d} сентября свиданий не запланировано.</div>`;
return es.map(e=>{const idx=S.ev.indexOf(e);return `<div class="card" style="display:flex;align-items:center;gap:14px;border-radius:40px">${av(e.p,64)}<div><div style="font-size:19px">${pp(e.p).n}</div><div class="mute" style="font-size:13px;margin-top:2px">${d} сентября, ${e.t} · ${esc(e.pl)}</div><div style="font-size:12.5px;margin-top:6px;${e.st=='ok'?'color:var(--gold)':''}">${e.st=='ok'?'✓ Подтверждено':'Думает над приглашением…'}</div></div></div>`}).join('')}
function toggleResched(i){S.resched=S.resched===i?null:i;if(S.resched===i){S.rd=S.inc[i].d;S.rt=S.inc[i].t}render()}
function setReschedDate(d){S.rd=d;render()}
function sendResched(i){toast('Предложение перенести время отправлено');S.resched=null;render()}
/* ---------- places ---------- */
function place(){if(S.pd)return pdetail(plc(S.pd));return `<h1>Место свидания</h1><p class="sub">Мы подобрали для вас атмосферные места рядом, чтобы познакомиться в реальной жизни.</p>${S.pick?'<div class="sticky">Выбери место для приглашения — нажми на карточку.</div>':''}
<div class="chips">${['Рестораны','Бары','Творчество','Активность'].map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>
${PL.filter(x=>x.cat==S.cat).map((x,i)=>`<div class="place" onclick="go({pd:${x.id}})"><div class="ph" style="background:${grad(x.id)},${'linear-gradient(#000,#000)'};background:linear-gradient(150deg,${x.g.split(',')[0]},${x.g.split(',')[1]});display:grid;place-items:center;font-size:44px">${ic({Рестораны:'fork',Бары:'glass',Творчество:'brush',Активность:'bolt'}[x.cat],44)}</div><div><div class="script" style="font-size:28px">${x.n}</div><div style="font-size:13.5px;margin:4px 0">${x.d}</div><div style="color:var(--gold);font-size:14px">${x.r} ★</div>${x.t.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`).join('')}`}
function pdetail(x){const sv=S.save.includes(x.id);return `<button class="chip" onclick="go({pd:null})">← К списку</button><div class="card" style="padding:0;overflow:hidden;margin-top:12px"><div style="height:280px;background:linear-gradient(160deg,${x.g.split(',')[0]},${x.g.split(',')[1]});position:relative;text-align:center;padding-top:26px"><div class="mute">Место свидания</div><div class="script" style="font-size:44px">${x.n}</div><button style="position:absolute;right:16px;top:14px;background:none;border:0;font-size:26px;cursor:pointer" onclick="S.save=S.save.includes(${x.id})?S.save.filter(i=>i!=${x.id}):[...S.save,${x.id}];render()">${ic(sv?'starf':'star',28)}</button></div></div>
<div class="card"><div class="ir">${ic('pin',20)}${x.ad}</div><div class="ir">${ic('clock',20)}Время работы: ${x.h}</div><div class="ir">${ic('globe',20)}<u>Веб-сайт</u></div><div class="ir">${ic('phone',20)}${x.ph}</div></div>
<div class="card"><div style="font-size:20px;margin-bottom:10px">Отзывы</div>${x.rv.map(r=>`<div style="display:flex;gap:12px;margin-bottom:10px">${av(1+(x.id%4),46)}<div><div style="color:var(--gold)">★★★★☆</div><div style="font-size:13.5px;line-height:1.4">${r}</div></div></div>`).join('')}</div>
${S.pick?`<button class="btn main" onclick="choose(${x.id})">Выбрать это место</button>`:`<button class="btn" onclick="toast('Выбери человека на главной и нажми «Пригласить»')">Как пригласить сюда?</button>`}`}
function choose(id){S.inv.pl=id;go({scr:'inv',tab:'home',pick:false,pd:null,open:null})}
/* ---------- planner ---------- */
function plan(){return `<h1>Планнер</h1><p class="sub">Все твои свидания — в одном месте.</p>
<div class="card" style="border-radius:24px;padding:16px"><div style="display:flex;justify-content:space-between;font-size:22px;font-weight:600"><span>2026</span><span>SEPTEMBER</span></div>${calGrid(S.sd,'pickDay')}</div>
<div id="dayInfo">${dayInfoHTML(S.sd)}</div>
${S.inc.length?`<div style="margin:16px 4px 10px">Входящие приглашения</div>`+S.inc.map((c,i)=>`<div class="card" style="border-radius:28px"><div style="display:flex;gap:12px;align-items:center">${av(c.p,58)}<div><b style="font-weight:500;font-size:18px">${pp(c.p).n}</b><div class="mute" style="font-size:13px">${plc(c.pl).n} · ${c.d} сентября, ${c.t}</div></div></div><div class="letter sm s-${c.st||'tender'}">${esc(c.tx)}</div><div class="mute" style="font-size:12.5px">${c.cond}</div><div style="display:flex;gap:10px;margin-top:12px"><button class="btn sm main" style="flex:1" onclick="accept(${i})">Принять</button><button class="btn sm" style="flex:1" onclick="S.inc.splice(${i},1);render()">Отклонить</button></div><div style="margin-top:10px;text-align:center"><button class="chip" onclick="toggleResched(${i})">${S.resched===i?'Свернуть':'Предложить перенести время'}</button></div>${S.resched===i?`<div style="margin-top:12px">${calGrid(S.rd,'setReschedDate')}<div class="times">${T.map(t=>`<button class="${S.rt==t?'sel':''}" onclick="S.rt='${t}';render()">${t}</button>`).join('')}</div><button class="btn sm main" style="margin-top:10px" onclick="sendResched(${i})">Отправить предложение</button></div>`:''}</div>`).join(''):''}
<div style="margin:18px 4px 10px">Все свидания</div>${S.ev.slice().sort((a,b)=>a.d-b.d).map(evc).join('')}`}
function evc(e,i){const idx=S.ev.indexOf(e);return `<div class="card" style="display:flex;align-items:center;gap:14px;border-radius:60px;padding:10px 24px 10px 10px">${av(e.p,72)}<div style="text-align:center;flex:1"><div style="font-size:14px">${e.d} сентября ${e.t}</div><div style="font-size:13px" class="mute">${esc(e.pl)}</div><div style="font-size:22px">${pp(e.p).n}</div>${e.st=='wait'?`<button class="chip" style="padding:5px 12px;font-size:12px" onclick="S.ev[${idx}].st='ok';render();toast('${pp(e.p).n} принял(а) приглашение')">Думает… · демо: принять</button>`:'<div style="color:var(--gold);font-size:12px">✓ подтверждено</div>'}</div></div>`}
function accept(i){const c=S.inc.splice(i,1)[0];S.ev.push({d:c.d,t:c.t,pl:plc(c.pl).n,p:c.p,st:'ok'});S.sd=c.d;render();toast('Свидание добавлено в планнер ✓')}
/* ---------- profile ---------- */
function prof(){const u=S.u;return `<div style="margin:-18px -16px 16px;padding:26px 20px 20px;background:linear-gradient(160deg,#680209,#0a0304);border-radius:0 0 40px 40px;position:relative"><div style="display:flex;justify-content:space-between"><button class="chip" onclick="S.edit=!S.edit;render()">${ic('edit',16)} ${S.edit?'Готово':'Править'}</button><button class="chip" onclick="paywall()">${ic('gear',16)} ${S.prem?'Premium':'Подписка'}</button></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><div><div style="font-size:26px;letter-spacing:.04em">${esc(u.n)}, ${u.a}</div><div class="mute">${esc(u.job)}</div></div><div onclick="storyAct()" style="cursor:pointer" title="Выложить историю">${av('me',96,S.story?'ring':'')}</div></div>
<input class="in" style="margin:20px 0 0;text-align:center;border-radius:30px" maxlength="40" value="${esc(u.mood)}" onchange="S.u.mood=this.value" aria-label="Статус дня"></div>
<div class="photo ph" style="height:300px;margin:14px 0;background:${grad(0,S.ph.me||0)}" onclick="S.ph.me=((S.ph.me||0)+1)%3;render()"><span style="opacity:.14">${ic('user',110)}</span><div class="dots">${[0,1,2].map(j=>`<u class="${j==(S.ph.me||0)?'on':''}"></u>`).join('')}</div></div>
<div class="card" style="border-radius:40px"><div>Любимые места свиданий:</div><div class="mute" style="margin-top:6px;font-size:14px">${S.save.length?S.save.map(i=>plc(i).n).join(', '):'Пока не выбраны — нажми ☆ в карточке места'}</div></div>
<div class="card cr" style="border-radius:40px"><div style="text-align:right;font-family:'Cormorant Garamond';font-size:20px;font-weight:600">AI profile</div>${S.edit?['job:Профессия','int:Интересы','food:Еда','bio:О себе','world:Мировоззрение','zodiac:Знак зодиака','height:Рост, см','edu:Образование','alco:Алкоголь','smoke:Курение'].map(s=>{const[k,l]=s.split(':');return `<div style="margin-top:10px">${l}</div><textarea class="in" rows="${['bio','world'].includes(k)?2:1}" onchange="S.u['${k}']=this.value">${esc(u[k])}</textarea>`}).join(''):[['int','Интересы'],['food','Еда'],['world','Мировоззрение']].map(([k,l])=>`<div style="margin-top:10px">${l}</div><div class="mute">${esc(u[k])||'—'}</div>`).join('')+`<div style="display:flex;gap:22px;margin-top:12px"><div><div style="margin-bottom:2px">Рост</div><div class="mute">${esc(u.height)||'—'}</div></div><div><div style="margin-bottom:2px">Знак зодиака</div><div class="mute">${esc(u.zodiac)||'—'}</div></div></div><div style="display:flex;gap:22px;margin-top:12px"><div><div style="margin-bottom:2px">Алкоголь</div><div class="mute">${esc(u.alco)||'—'}</div></div><div><div style="margin-bottom:2px">Курение</div><div class="mute">${esc(u.smoke)||'—'}</div></div></div><div style="margin-top:10px">Образование</div><div class="mute">${esc(u.edu)||'—'}</div><div style="margin-top:10px">О себе</div><div class="mute" style="font-size:14px;line-height:1.5">${esc(u.bio)||'—'}</div>`}</div>
<div class="card" style="border-radius:40px"><div>Ищу</div><div class="seg" style="margin:10px 0 0">${[['f','Женщин'],['m','Мужчин']].map(([v,l])=>`<button class="${S.u.look==v?'on':''}" onclick="S.u.look='${v}';render()">${l}</button>`).join('')}</div></div>
<div class="card" style="border-radius:40px"><div>Подписка</div><div class="mute" style="font-size:13.5px;margin:6px 0 12px">Без рекламы · без лимита приглашений · больше фото · истории 24 ч</div><button class="btn sm ${S.prem?'':'main'}" onclick="S.prem?(S.prem=false,render()):paywall()">${S.prem?'Отключить (демо)':'Оформить'}</button></div>
<div class="card" style="border-radius:40px"><div>Для заведений (в разработке)</div><div class="mute" style="font-size:13.5px;margin-top:6px">Заведение регистрирует аккаунт, гости оставляют отзывы после свидания — так рекламу получают и заведение, и пары.</div></div>`}
function storyAct(){const d=document.createElement('div');d.className='modal';d.onclick=e=>{if(e.target===d)d.remove()};
if(!S.prem){d.innerHTML=`<div><div class="script" style="font-size:32px;text-align:center">История</div><p class="sub" style="margin-top:8px">Публикация историй на 24 часа — премиум-функция.</p><button class="btn main go" id="sSub"><span>Оформить подписку</span></button></div>`;$('#app').append(d);$('#sSub').onclick=()=>{d.remove();paywall('Истории на 24 часа доступны по подписке')};return}
if(S.story){d.innerHTML=`<div><div class="script" style="font-size:32px;text-align:center">Твоя история</div><p class="sub" style="margin-top:8px">«${esc(S.story)}» · исчезнет через 24 часа</p><button class="btn" id="sDel">Удалить историю</button></div>`;$('#app').append(d);$('#sDel').onclick=()=>{S.story=null;d.remove();render()};return}
d.innerHTML=`<div><div class="script" style="font-size:32px;text-align:center">Выложить историю</div><p class="sub" style="margin-top:6px">Премиум-функция · видна 24 часа</p><input class="in" id="sIn" placeholder="Например: Сегодня творческий вайб" style="margin-top:8px"><button class="btn main go" id="sPub"><span>Опубликовать</span></button></div>`;$('#app').append(d);$('#sPub').onclick=()=>{const v=$('#sIn').value.trim()||'Сегодня отличное настроение';S.story=v;d.remove();render();toast('История опубликована на 24 часа')}}
function paywall(m){const d=document.createElement('div');d.className='modal';d.onclick=e=>{if(e.target==d)d.remove()};d.innerHTML=`<div><div class="script" style="font-size:36px;text-align:center">Invia Premium</div><p class="sub" style="margin-top:8px">${m||'Больше романтики — меньше ограничений.'}</p><div style="line-height:2;font-size:15px;margin-bottom:16px">✓ Реклама отключена<br>✓ Приглашения без лимита (сейчас 3 в неделю)<br>✓ Больше фото в профиле<br>✓ Истории на 24 часа</div><button class="btn main go" id="sb">Оформить подписку (демо)</button></div>`;$('#app').append(d);$('#sb').onclick=()=>{S.prem=true;d.remove();render();toast('Premium включён')}}
/* ---------- router ---------- */
function render(){const st=$('#mn')?$('#mn').scrollTop:0,sc=S.scr;let h;
if(sc=='reg')h=reg();else if(sc=='chat')return draw();else if(sc=='confirm')h=confirmP();else if(sc=='match')h=match();else if(sc=='inv')h=inv();
else{const b={home,place,plan,prof}[S.tab]();h=shell(b,S.tab=='home'?'snap':'')}
$('#app').innerHTML=h;document.querySelectorAll('.btn:not(.sm)').forEach(b=>{if(!b.firstElementChild)b.classList.add('go')});const m=$('#mn');if(m&&sc!='match'&&sc!='confirm')m.scrollTop=st;document.querySelectorAll('.wh').forEach(w=>w.scrollTop=w.dataset.i*40)}
render();
</script></body></html>
